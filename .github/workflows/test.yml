name: Test

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --frozen --extra hdf5 --group dev

      - run: uv run pytest tests/ -m 'not timelimit and not cpp' -k 'not CPLEX_PY'

      # - name: Setup tmate session
      #   if: ${{ failure() }}
      #   uses: mxschmitt/action-tmate@v3

      - name: Upload failed MCES structure SVG
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-structure
          path: "testdata/mces_struct_*.svg"

  # same tests, but with the c++ extension installed (`cpp` extra)
  # builds a single wheel the same way as for publishing (see publish.yml)
  test-cpp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build C++ extension wheel
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: cp312-manylinux_x86_64
        with:
          package-dir: cpp
          output-dir: wheels

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --group dev

      - name: Install C++ extension wheel
        run: uv pip install wheels/*.whl

      # --no-sync, otherwise uv would remove the wheel again
      - run: uv run --no-sync pytest tests/ -m 'not timelimit' -k 'not CPLEX_PY'

  nextflow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nf-core/setup-nextflow@v1

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - run: uv sync --frozen --extra hdf5 --group dev

      - run: uv run nf-test test --ci nextflow/tests/

      - run: uv run pytest tests/test_all_modes_agree.py -v
