name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      
      # micromamba setup for boost + rdkit headers
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/test-env.yml
          environment-name: mm_test
          create-args: python=${{ matrix.python-version }}
          cache-environment: true
          cache-downloads: true
        
      - name: Cache fast wheel
        id: cache-mm-wheel
        uses: actions/cache@v4
        with:
          path: wheels/*.whl
          key: fastwheel-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/cpp/**', 'pyproject.toml') }}

      - name: Build fast wheel
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        shell: micromamba-shell {0}
        run: |
          micromamba activate mm_test
          mkdir -p wheels
          pip wheel . -w wheels/ --no-deps --no-build-isolation -C cmake.args="-DFAST_BUILD=ON"

      # uv setup for testing
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --group dev --no-install-workspace
      - run: uv pip install --no-deps --find-links wheels/ myopic-mces

      - run: uv run --no-project pytest -m 'not timelimit' -k 'not CPLEX_PY'

      # - name: Setup tmate session
      #   if: ${{ failure() }}
      #   uses: mxschmitt/action-tmate@v3

      - name: Upload failed MCES structure SVG
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-structure
          path: "testdata/mces_struct_*.svg"
