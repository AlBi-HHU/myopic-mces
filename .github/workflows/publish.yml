name: Build and publish

# publishes both packages with the same version:
#   1. myopic_mces_cpp (C++ extension, platform wheels built via build_verify.yml)
#   2. myopic_mces     (pure python, depends on myopic_mces_cpp via the "cpp" extra)
# the C++ extension has to be uploaded first, so that the extra can be resolved
on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

jobs:
  version_check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Version & Dependency Sync (Pure Bash)
        id: check
        run: |
          # check package versions for package and cpp extension
          V1=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)["'\''].*/\1/p' pyproject.toml)
          V2=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)["'\''].*/\1/p' cpp/pyproject.toml)

          # extract cpp dependency version
          V3=$(sed -nE 's/.*myopic_mces_cpp[>==]+([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p' pyproject.toml)

          echo "myopic_mces (python package):      $V1"
          echo "myopic_mces_cpp (c++ extension):   $V2"
          echo "myopic_mces_cpp (dependency):      $V3"

          # check if all values were extracted successfully
          if [ -z "$V1" ] || [ -z "$V2" ] || [ -z "$V3" ]; then
            echo "::error::Unable to extract all values from the pyproject.tomls!"
            exit 1
          fi

          # match all 3 versions
          if [ "$V1" != "$V2" ] || [ "$V1" != "$V3" ]; then
            echo "::error::Version Mismatch! $V1 (python package) != $V2 (c++ extension) != $V3 (c++ dependency)"
            exit 1
          fi

          echo "All three version synched, moving on"

          # releases on PyPI cannot be overwritten, so fail early if the version was not bumped
          for PKG in myopic_mces myopic_mces_cpp; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PKG/$V1/json")
            if [ "$STATUS" = "200" ]; then
              echo "::error::$PKG $V1 already exists on PyPI, bump the version first!"
              exit 1
            fi
          done

          echo "version=$V1" >> "$GITHUB_OUTPUT"

  per_os:
    needs: [version_check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    uses: ./.github/workflows/build_verify.yml
    with:
      os: ${{ matrix.os }}
      pythons: '["3.12","3.13","3.14"]'


  # if all wheels have been built and are valid, upload to pypi
  upload_cpp_pypi:
    name: Publish C++ extension to PyPI
    needs: [per_os]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
       id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  upload_pure_py_pypi:
    name: Publish pure Python package to PyPI
    needs: [upload_cpp_pypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build package
        run: |
          python -m pip install --upgrade build

      - name: Build
        run: |
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
