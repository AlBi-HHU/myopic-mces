[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "myopic_mces"
version = "1.3.2"
description = "A package for computation of the myopic MCES distance"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
            "Programming Language :: Python :: 3",
            "License :: OSI Approved :: MIT License",
            "Operating System :: OS Independent",
]
dependencies = [
             "rdkit == 2025.3.4",
             "networkx >= 3.0",
             "pulp[cbc]>=2.7.0,<=3.3.2",
             "scipy >= 1.10.1",
             "joblib >= 1.2.0",
             "pandas>=2.3.3",
]

[project.scripts]
myopic_mces = "myopic_mces.myopic_mces:main"

[project.urls]
"Homepage" = "https://github.com/AlBi-HHU/myopic-mces"
"Bug Tracker" = "https://github.com/AlBi-HHU/myopic-mces/issues"
"Publication" = "https://doi.org/10.1101/2023.03.27.534311"

[project.optional-dependencies]
cplex = [
    "cplex>=22.1.1.2",
    "docplex>=2.32.264",
]
hdf5 = [
    "h5py>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5"
]

[tool.scikit-build]
cmake.source-dir = "src/cpp"
wheel.packages = ["src/myopic_mces"]
wheel.expand-macos-universal-tags = false

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*" # does not work with conda-forge Boost

# this does not the test the repo, but the wheel after repairing
# important to check if bindings are valid
# and it also checks if there are duplicate library dependencies present
test-command = "python {project}/tests/test_import_smoke.py && pytest -m \"not timelimit\" -k \"not CPLEX_PY\""
test-sources = ["tests", "testdata"]
test-groups = ["dev"]
test-extras = ["cplex", "hdf5"]

# this final part is claude
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

############################ CIBW LINUX

[tool.cibuildwheel.linux]
before-build = "bash {project}/ci/cibw_before_build_linux.sh"
repair-wheel-command = """
export LD_LIBRARY_PATH=${CONDA_PREFIX}/lib/python${PYTAG}/site-packages/rdkit.libs:$LD_LIBRARY_PATH &&
auditwheel show {wheel} &&
auditwheel repair \
  --exclude 'libRDKit*' \
  --exclude '*boost_python*' \
  -w {dest_dir} \
  {wheel}
"""
[tool.cibuildwheel.linux.environment]
PYTAG = "$(python -c 'import sys; print(f\"{sys.version_info.major}.{sys.version_info.minor}\")')"
CONDA_PREFIX = "/tmp/mm_env"
CMAKE_PREFIX_PATH = "/tmp/mm_env"
RDKIT_INCLUDE_DIR = "/tmp/rdkit/Code"
RDKIT_BUILD_INCLUDE_DIR = "/tmp/rdkit-build/Code"
RDKIT_LIB_DIR = "/tmp/mm_env/lib/python${PYTAG}/site-packages/rdkit.libs"
CC = "/opt/rh/gcc-toolset-10/root/usr/bin/gcc"
CXX = "/opt/rh/gcc-toolset-10/root/usr/bin/g++"
LD_LIBRARY_PATH = "/tmp/mm_env/lib:/tmp/mm_env/lib/python${PYTAG}/site-packages/rdkit.libs:/tmp/mm_env/lib/python${PYTAG}/site-packages/rdkit/libs:$LD_LIBRARY_PATH"

############################ CIBW MACOS

[tool.cibuildwheel.macos]
before-build = "bash {project}/ci/cibw_before_build_macos.sh"
repair-wheel-command = """
export DYLD_LIBRARY_PATH=/tmp/mm_env/lib/python${PYTAG}/site-packages/rdkit/.dylibs:/tmp/mm_env/lib &&
delocate-wheel --require-archs {delocate_archs} \
  --exclude libRDKit \
  --exclude libboost_python \
  -w {dest_dir} {wheel}
"""
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
PYTAG = "$(python -c 'import sys; print(f\"{sys.version_info.major}.{sys.version_info.minor}\")')"
CONDA_PREFIX = "/tmp/mm_env"
CMAKE_PREFIX_PATH = "/tmp/mm_env"
RDKIT_INCLUDE_DIR = "/tmp/rdkit/Code"
RDKIT_BUILD_INCLUDE_DIR = "/tmp/rdkit-build/Code"
RDKIT_LIB_DIR = "/tmp/mm_env/lib/python${PYTAG}/site-packages/rdkit/.dylibs"
CC = "clang"
CXX = "clang++"

############################ CIBW WINDOWS

[tool.cibuildwheel.windows]
archs = ["auto64"]
before-build = "powershell {project}/ci/cibw_before_build_windows.ps1"
#repair-wheel-command = """
#delvewheel repair --add-path C:/mm_env/Lib/site-packages/rdkit.libs;C:/mm_env/Library/bin -w {dest_dir} {wheel}
#"""
repair-wheel-command = "python {project}/ci/repair_windows.py {wheel} {dest_dir}"
[tool.cibuildwheel.windows.environment]
PYTAG = "& python -c 'import sys; print(f\"{sys.version_info.major}.{sys.version_info.minor}\")'"
CONDA_PREFIX = "C:/mm_env"
CMAKE_PREFIX_PATH = "C:/mm_env"
RDKIT_INCLUDE_DIR = "C:/rdkit-src/Code"
RDKIT_BUILD_INCLUDE_DIR = "C:/rdkit-src/Code"
RDKIT_LIB_DIR = "C:/mm_env/Lib/site-packages/rdkit.libs"
# this is hartcoded, fix if boost version of rdkit changes (so if rdkit version changes)
BOOST_INCLUDE_DIR = "C:/mm_env/include/boost-1_85"
