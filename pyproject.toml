[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# remember to change the cpp extension pyproject.toml as well!
# file: cpp/pyproject.toml
[project]
name = "myopic_mces"
version = "1.3.2"
description = "A package for computation of the myopic MCES distance"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
            "Programming Language :: Python :: 3",
            "License :: OSI Approved :: MIT License",
            "Operating System :: OS Independent",
]
dependencies = [
             "rdkit >= 2022.09.5",
             "networkx >= 3.0",
             "pulp[cbc]>=2.7.0,<=3.3.2",
             "scipy >= 1.10.1",
             "joblib >= 1.2.0",
             "pandas>=2.3.3",
             "cibuildwheel>=2.23.4",
]

[project.scripts]
myopic_mces = "myopic_mces.myopic_mces:main"

[project.urls]
"Homepage" = "https://github.com/AlBi-HHU/myopic-mces"
"Bug Tracker" = "https://github.com/AlBi-HHU/myopic-mces/issues"
"Publication" = "https://doi.org/10.1101/2023.03.27.534311"

[project.optional-dependencies]
cplex = [
    "cplex>=22.1.1.2",
    "docplex>=2.32.264",
]
hdf5 = [
    "h5py>=3.0",
]
cpp = ["myopic-mces-cpp"]

[dependency-groups]
dev = [
    "pytest>=8.3.5"
]
[tool.uv.sources]
myopic-mces-cpp = { path = "cpp" }
