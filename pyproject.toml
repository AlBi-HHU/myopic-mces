[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "myopic_mces"
version = "1.3.2"
description = "A package for computation of the myopic MCES distance"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
            "Programming Language :: Python :: 3",
            "License :: OSI Approved :: MIT License",
            "Operating System :: OS Independent",
]
dependencies = [
             "rdkit >= 2022.09.5",
             "networkx >= 3.0",
             "pulp[cbc]>=2.7.0",
             "scipy >= 1.10.1",
             "joblib >= 1.2.0",
]

[project.scripts]
myopic_mces = "myopic_mces.myopic_mces:main"

[project.urls]
"Homepage" = "https://github.com/AlBi-HHU/myopic-mces"
"Bug Tracker" = "https://github.com/AlBi-HHU/myopic-mces/issues"
"Publication" = "https://doi.org/10.1101/2023.03.27.534311"

[project.optional-dependencies]
cplex = [
    "cplex>=22.1.1.2",
    "docplex>=2.32.264",
]
hdf5 = [
    "h5py>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pandas>=2.0.3"
]

[tool.scikit-build]
cmake.source-dir = "src/cpp"
wheel.packages = ["src/myopic_mces"]
wheel.expand-macos-universal-tags = false

[tool.cibuildwheel]
#build = "cp310-* cp311-* cp312-* cp313-*"
build= "cp310-*"
skip = "*-musllinux_* pp*" # does not work with conda-forge Boost

test-command = "pytest -m 'not timelimit' -k 'not CPLEX_PY'"
test-sources = "tests"
test-groups = ["dev"]
test-extras = ["cplex", "hdf5"]

# this final part is claude
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
before-build = "bash {project}/ci/cibw_before_build_linux.sh"
environment = { CONDA_PREFIX = "/tmp/mm_env", CMAKE_PREFIX_PATH = "/tmp/mm_env", RDKIT_INCLUDE_DIR = "/tmp/rdkit/Code", RDKIT_BUILD_INCLUDE_DIR = "/tmp/rdkit-build/Code", RDKIT_LIBRARY_DIR = "/tmp/mm_env/lib" }
repair-wheel-command = "export LD_LIBRARY_PATH=/tmp/mm_env/lib:/tmp/mm_env/lib/python3.10/site-packages/rdkit.libs:$LD_LIBRARY_PATH && auditwheel show {wheel} && auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
before-build = "bash {project}/ci/cibw_before_build_macos.sh"
environment = { CONDA_PREFIX = "/tmp/mm_env", CMAKE_PREFIX_PATH = "/tmp/mm_env" }
repair-wheel-command = "DYLD_LIBRARY_PATH=/tmp/mm_env/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
before-build = "powershell {project}/ci/cibw_before_build_windows.ps1"
environment = { CONDA_PREFIX = "C:\\mm_env", CMAKE_PREFIX_PATH = "C:\\mm_env" }
repair-wheel-command = "delvewheel repair --add-path C:\\mm_env\\Library\\bin -w {dest_dir} {wheel}"
